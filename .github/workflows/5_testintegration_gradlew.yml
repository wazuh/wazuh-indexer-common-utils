name: Test Integration Common Utils

on: [push, pull_request]

jobs:
  build-linux:
    strategy:
      matrix:
        # Testing against Java 21 (current LTS) and Java 25 (future-proofing)
        java: [ 21, 25 ]

    runs-on: ubuntu-latest
    name: Build and test Common Utils (Java ${{ matrix.java }})

    steps:
      # Step 1: Set up the Java environment using the Temurin distribution
      - name: Set Up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ matrix.java }}

      # Step 2: Check out the current branch from the repository
      - name: Checkout Branch
        uses: actions/checkout@v6

      # Step 3: Run 'check' task which includes unit tests and code style validations (Spotless/Checkstyle)
      - name: Run Tests
        run: |
          ./gradlew check

      # Step 4: Upload test reports only if the previous step fails
      - name: Upload failed logs
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: logs-java-${{ matrix.java }}
          overwrite: 'true'
          # Standard Gradle path for HTML test reports
          path: build/reports/tests/test/*
